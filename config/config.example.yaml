# stream-clipper example config. Copy to config/config.yaml and edit.
# Validate with:  docker compose run --rm clipper validate-config
# Anything marked FILL_ME must be replaced from the real campaign briefs.

global:
  timezone: Europe/Bratislava
  log_level: INFO
  buffer:
    segment_seconds: 5
    retention_seconds: 300        # rolling live buffer (~5 min)
    poll_interval_seconds: 60     # check offline channels this often
  workers:
    cpu_workers: 3                # transcribe/render processes (16 vCPU box: 3 x 4 threads)
    threads_per_worker: 4
    io_slots: 4                   # downloads / cuts / uploads in parallel
    max_attempts: 5
  whisper:
    model: medium                 # subtitles
    vod_scoring_model: small      # full-length VOD transcription for highlight scoring
    compute_type: int8
    vad: true
  output:
    video_bitrate: 8M
    preset: medium
    font: Montserrat ExtraBold
    font_size: 80
    motion:                       # smart zoom + motion effects (README section 3b)
      enabled: true
      smart_zoom: true            # punch-in on loud reactions + the chat-spike moment
      zoom_strength: 0.15         # 115 %
      max_zooms_per_minute: 3
      ken_burns: 0.05             # slow push-in over the whole clip
      shake: true                 # short shake on the strongest moment
  delivery:
    backend: local                # local -> /output/<campaign>/<date>/ ; rclone -> Google Drive
    local_dir: /output
    rclone:
      remote: gdrive
      root: stream-clipper
      config_path: /config/rclone/rclone.conf
  notifications:
    backend: none                 # none | telegram | ntfy   (telegram: README section 5)
    telegram:
      bot_token: ""               # from @BotFather
      chat_id: ""                 # empty = auto (whoever presses Start on the bot first)
      send_video: true            # every clip as a video + copy-ready captions
    spike_alerts: true            # silent "chat spike" ping when a clip starts
    ntfy: {server: "https://ntfy.sh", topic: "", token: ""}
    top_n: 3
    batch_seconds: 300
    daily_summary_time: "20:00"
  llm:                            # local Ollama LLM (README section 3c); false = no LLM at all
    enabled: true
    ollama_url: http://ollama:11434
    model: qwen3.5:4b              # pulled automatically on first start (~3 GB)
    think: false                  # thinking mode is too slow on CPU
    live_judge: true              # rate every live clip from transcript + chat before rendering
    min_score: 5                  # 0-10; below this the clip is skipped (not rendered, not sent)
    keep_strength: 28             # ...unless the chat spike is this strong (often a visual moment)
    trim: true                    # LLM picks start (setup) and end (payoff) ...
    context_seconds: 20           # ... inside this much extra footage before/after
    hook_overlay: true            # hook title burned on top for the first seconds
    hook_seconds: 3

campaigns:
  CORE:
    creator_name: "FILL_ME"
    required_hashtags: ["#FILL_ME"]
    caption_language: en
    allowed_platforms: [tiktok, instagram, youtube]
    min_seconds: 61
    max_seconds: 90
    notes: "Paste rules from the CORE brief here."
  Kai:
    creator_name: "@kaicenat"
    creator_aliases: [kai, kai cenat, kaicenat]
    required_hashtags: ["#FILL_ME"]
    min_seconds: 61
    max_seconds: 90
  Lacy:
    creator_name: "@lacy"
    creator_aliases: [lacy]
    required_hashtags: ["#FILL_ME"]
    min_seconds: 61
    max_seconds: 90
  Jason:
    creator_name: "@jasontheween"
    creator_aliases: [jason, jasontheween, the ween]
    required_hashtags: ["#FILL_ME"]
    min_seconds: 61
    max_seconds: 90

sources:
  kaicenat:
    mode: live
    platform: twitch
    url: https://www.twitch.tv/kaicenat
    language: en
    campaigns: [Kai, CORE]
    layout:
      type: blur_fit              # IRL-heavy streams; switch to stack once crops are measured
    clip:
      pre_seconds: 30
      post_seconds: 35
      chat_delay_seconds: 6
    spike:
      # threshold = max(min_messages, multiplier x avg, avg + z_threshold x std)
      # avg/std = messages per 10 s over the last 5 min, recomputed every second
      multiplier: 2.0             # chat must at least double vs. its own average
      z_threshold: 3.0            # ...and stand out from its normal noise
      min_messages: 60            # only a sanity floor; the average does the work
      min_unique_chatters: 30
      min_strength: 14            # weak / non-reaction spikes don't make clips (README section 7)
      max_clips_per_hour: 4       # more only for really big moments (>= 2x min_strength)

  lacy:
    mode: live
    platform: twitch
    url: https://www.twitch.tv/lacy
    language: en
    campaigns: [Lacy, CORE]
    layout: {type: blur_fit}       # switch to stack after: stream-clipper crop-helper
    clip: {pre_seconds: 30, post_seconds: 35, chat_delay_seconds: 6}
    spike: {multiplier: 2.0, z_threshold: 3.0, min_messages: 40, min_unique_chatters: 20, min_strength: 14, max_clips_per_hour: 4}

  marlon:
    mode: live
    platform: twitch
    url: https://www.twitch.tv/marlon
    language: en
    campaigns: [CORE]
    layout: {type: blur_fit}       # switch to stack after: stream-clipper crop-helper
    clip: {pre_seconds: 30, post_seconds: 35, chat_delay_seconds: 6}
    spike: {multiplier: 2.0, z_threshold: 3.0, min_messages: 40, min_unique_chatters: 20, min_strength: 14, max_clips_per_hour: 4}

  jasontheween:
    mode: live
    platform: twitch
    url: https://www.twitch.tv/jasontheween
    language: en
    campaigns: [Jason, CORE]
    layout: {type: blur_fit}       # switch to stack after: stream-clipper crop-helper
    clip: {pre_seconds: 30, post_seconds: 35, chat_delay_seconds: 6}
    spike: {multiplier: 2.0, z_threshold: 3.0, min_messages: 40, min_unique_chatters: 20, min_strength: 14, max_clips_per_hour: 4}

  kai_youtube_vods:
    mode: vod
    platform: youtube
    url: https://www.youtube.com/@KaiCenat/videos
    language: en
    campaigns: [Kai]
    layout: {type: blur_fit}
    vod:
      watch: true                 # poll the channel for new uploads
      watch_interval_seconds: 3600
      watch_max_items: 2
      top_n: 10
      keywords: ["no way", "oh my god", "bro", "let's go", "chat", "what"]
