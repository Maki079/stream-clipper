[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-clipper"
version = "0.1.0"
description = "Headless auto-clipper: live chat spikes and VOD highlights to vertical clips"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6",
  "httpx>=0.27",
  "websockets>=13",
  "numpy>=1.26",
  "pillow>=10",
  "faster-whisper>=1.1",
  "streamlink>=7",
  "yt-dlp[default,curl-cffi]",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
youtube-extra = ["chat-downloader>=0.2.8", "google-api-python-client>=2"]

[project.scripts]
stream-clipper = "stream_clipper.cli:main"

[tool.setuptools.packages.find]
include = ["stream_clipper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ffmpeg: needs ffmpeg/ffprobe binaries",
  "slow: downloads models or runs long",
]
