services:
  clipper:
    build: .
    image: stream-clipper:latest
    container_name: stream-clipper
    restart: unless-stopped
    command: ["web", "--host", "0.0.0.0", "--autostart", "--record-chat"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on: [ollama]   # chat logs in data/chatlogs/ for tuning; remove the flag later
    stop_grace_period: 90s          # web process waits for the supervisor to finish running work
    environment:
      - TZ=Europe/Bratislava
      - CLIPPER_WEB_PASSWORD=${CLIPPER_WEB_PASSWORD:-}
      - CLIPPER_WEB_HOSTS=${CLIPPER_WEB_HOSTS:-}
    volumes:
      - ./config:/config            # config.yaml
      - ./rclone:/config/rclone     # rclone.conf (Google Drive OAuth), only needed for delivery.backend: rclone
      - ./buffer:/buffer            # rolling live buffers (~5 min per channel)
      - ./models:/models            # whisper models (downloaded once, ~2 GB)
      - ./data:/data                # SQLite state, work files, VOD downloads, chat logs
      - ./output:/output            # finished clips when delivery.backend: local
    deploy:
      resources:
        limits:
          cpus: "15"                # leave one core for the host
          memory: 40g
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  # Local LLM: rates live clips, picks the cut, writes the hook (docs/advanced.md#ai-highlight-judge).
  # The model (global.llm.model, ~3 GB) is pulled automatically on first start into models/ollama.
  # Without it (global.llm.enabled: false) clips are rendered exactly as planned.
  ollama:
    image: ollama/ollama:latest
    container_name: stream-clipper-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=30m       # keep the model in RAM between clips
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ./models/ollama:/root/.ollama
    deploy:
      resources:
        limits: {cpus: "8", memory: 12g}
